<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Page not found</title>
    <script>
      // Single-page apps on this site use client-side routes (for example
      // /nigerdelta-hsse-tracker/report). GitHub Pages has no such file, so
      // it serves this page; send the visitor back to the app with the path
      // in ?p= so the app can restore it.
      (function () {
        var apps = ['/nigerdelta-hsse-tracker/']
        var l = window.location
        for (var i = 0; i < apps.length; i++) {
          var base = apps[i]
          if (l.pathname.indexOf(base) === 0 && l.pathname !== base) {
            var rest = l.pathname.slice(base.length) + l.search
            l.replace(base + '?p=' + encodeURIComponent(rest) + l.hash)
            return
          }
        }
      })()
    </script>
    <style>
      body { font-family: system-ui, sans-serif; margin: 0; padding: 48px 16px; background: #fff; color: #1a1a1a; text-align: center; }
      a { color: #00758f; }
    </style>
  </head>
  <body>
    <h1>Page not found</h1>
    <p><a href="/">Go to the home page</a></p>
  </body>
</html>
